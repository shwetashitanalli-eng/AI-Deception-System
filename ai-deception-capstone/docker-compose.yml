version: '3.8'

services:
  # 1. Cowrie SSH Honeypot (Deception Layer)
  honeypot:
    build:
      context: ./deception_layer/honeypot
      dockerfile: Dockerfile
    container_name: cowrie_honeypot
    ports:
      - "2222:2222" # SSH Trapping Port
    volumes:
      - ./ml_engine/data:/cowrie/var/log/cowrie
    restart: always

  # 2. ML Threat Model Engine
  ml_engine:
    build:
      context: ./ml_engine
    container_name: ai_threat_engine
    volumes:
      - ./ml_engine/data:/app/data
      - ./ml_engine/models:/app/models
    command: python threat_model.py
    depends_on:
      - honeypot

  # 3. SOC Dashboard UI
  soc_dashboard:
    build:
      context: ./dashboard
    container_name: soc_dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./ml_engine/data:/app/ml_engine/data
    environment:
      - PORT=3000
    depends_on:
      - ml_engine
    restart: always
