version: '3.8'

services:
  backend:
    build: ./ml_engine
    container_name: ai_deception_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ai_deception.db
    restart: always

  frontend:
    build: ./dashboard
    container_name: ai_deception_frontend
    ports:
      - "3000:80"   # Maps your browser's port 3000 to Nginx's port 80
    depends_on:
      - backend
    restart: always

  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie_honeypot
    ports:
      - "2222:2222"
    restart: always