# cowrie.cfg - placeholder
# Use the official Cowrie configuration and tune according to your environment.
[DEFAULT]
# Path to Cowrie's data directory
data_path = /cowrie/var
# Logging
log_level = INFO
# Enable basic JSON logging to a file (placeholder configuration)
output_json = true
json_log_path = /cowrie/var/log/cowrie.json
# SSH
hostname = 0.0.0.0
port = 2222
