version: '3.8'

services:
  cowrie-honeypot:
    build: ./deception_layer/honeypot
    container_name: cowrie_trap
    ports:
      - "2222:2222"
    restart: always

  ml_engine:
    image: python:3.11-slim
    container_name: ml_engine
    working_dir: /app
    volumes:
      - ./ml_engine:/app
    command: tail -f /dev/null

  dashboard:
    image: node:18-slim
    container_name: dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: tail -f /dev/null
